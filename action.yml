name: Minify Lua
description: Minify Lua in place without changing line numbers
author: cybertk

branding:
  icon: minimize-2
  color: blue

inputs:
  path:
    description: Directory to search for Lua files. Relative paths start at the workspace root.
    required: false
    default: "."
  exclude:
    description: Comma-separated directory names to skip.
    required: false
    default: ".git,Libs,Embeds"
  tracked:
    description: Only minify Lua files tracked by git.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Minify Lua
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        MINIFY_EXCLUDE: ${{ inputs.exclude }}
        MINIFY_TRACKED: ${{ inputs.tracked }}
      run: |
        args=(--exclude "$MINIFY_EXCLUDE")
        if [ "$MINIFY_TRACKED" = "true" ]; then
          args+=(--tracked)
        fi
        python3 "$GITHUB_ACTION_PATH/minify_lua.py" "${args[@]}"
